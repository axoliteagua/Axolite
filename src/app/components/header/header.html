<header class="header">
  <div class="container nav-shell">
    <a routerLink="/" class="logo" aria-label="Axolite, inicio">
      <img src="assets/images/logo.png" alt="Axolite" class="logo-img" />
    </a>
    <nav aria-label="Navegación principal">
      <ul class="nav-list">
        @for (item of navItems; track item.path) {
          <li><a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.path === '/' }" class="nav-link">{{ item.label }}</a></li>
        }
      </ul>
    </nav>
    <a class="nav-cta" routerLink="/store">Ver catálogo <svg class="icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M5 19 19 5M7 5h12v12" /></svg></a>
  </div>
</header>
